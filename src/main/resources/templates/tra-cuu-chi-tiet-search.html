<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu chi tiết điểm – SGU 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .search-card {
            background: rgba(255,255,255,0.97);
            border-radius: 18px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.35);
            max-width: 480px;
            width: 100%;
            padding: 44px 36px 36px;
            text-align: center;
        }
        .icon-box {
            font-size: 3.5rem;
            color: #1e3c72;
            margin-bottom: 20px;
        }
        .btn-search {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: none;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: transform 0.2s;
        }
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30,60,114,0.3);
        }
    </style>
</head>
<body>

<div class="search-card">
    <div class="icon-box">
        <i class="bi bi-file-earmark-text-fill"></i>
    </div>
    <h3 class="fw-bold text-primary mb-2">Tra Cứu Chi Tiết Điểm</h3>
    <p class="text-muted mb-4">Xem bảng điểm chi tiết theo từng tổ hợp môn và phương thức xét tuyển.</p>

    <div th:if="${error}" class="alert alert-danger mb-4" th:text="${error}"></div>

    <form th:action="@{/tra-cuu/chi-tiet}" method="get">
        <div class="form-floating mb-4">
            <input type="text" class="form-control" id="cccd" name="cccd" placeholder="Số CCCD" required>
            <label for="cccd">Nhập số CCCD của bạn</label>
        </div>
        <button type="submit" class="btn btn-search btn-primary w-100 fs-5">
            <i class="bi bi-search me-2"></i> Xem chi tiết ngay
        </button>
    </form>

    <div class="mt-4">
        <a th:href="@{/tra-cuu}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Quay lại trang tra cứu kết quả
        </a>
    </div>
</div>

</body>
</html>
