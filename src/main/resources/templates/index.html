<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Tuyển Sinh SGU 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 100px rgba(0,0,0,0.5);
        }
        .hero-card h1 {
            font-weight: 800;
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #fff, #a5ccf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-card p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 40px;
        }
        .btn-portal {
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }
        .btn-outline-custom {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }
        .btn-portal:hover {
            transform: scale(1.05);
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .badge-live {
            background: #2ecc71;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }
        .badge-live::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="hero-card">
        <div class="badge-live">HỆ THỐNG ĐANG HOẠT ĐỘNG</div>
        <h1 th:text="${tieuDe}">Tuyển Sinh SGU 2026</h1>
        <p th:text="${moTa}">Chào mừng bạn đến với cổng tra cứu thông tin và kết quả xét tuyển chính thức của Đại học Sài Gòn.</p>
        
        <div class="row g-4 justify-content-center">
            <div class="col-md-5">
                <a th:href="@{/tra-cuu}" class="btn-portal btn-primary-custom w-100">
                    <i class="bi bi-person-check-fill me-2"></i> Tra Cứu Kết Quả
                </a>
            </div>
            <div class="col-md-5">
                <a th:href="@{/tra-cuu/chi-tiet}" class="btn-portal btn-outline-custom w-100">
                    <i class="bi bi-file-earmark-text-fill me-2"></i> Chi Tiết Điểm
                </a>
            </div>
            <div class="col-md-5">
                <a th:href="@{/gia-lap}" class="btn-portal btn-outline-custom w-100">
                    <i class="bi bi-calculator-fill me-2"></i> Giả Lập Tính Điểm
                </a>
            </div>
        </div>
        
        <div class="mt-5 pt-4 border-top border-secondary opacity-50 small">
            © 2026 Đại học Sài Gòn (SGU). Bảo lưu mọi quyền.
        </div>
    </div>

</body>
</html>
