<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tieuDe}">Tuyển Sinh SGU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card h1 {
            font-size: 1.8rem;
            color: #1e3c72;
            margin-bottom: 12px;
        }
        .card p {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #27ae60;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 th:text="${tieuDe}">Tuyển Sinh SGU</h1>
        <p th:text="${moTa}">Mô tả hệ thống.</p>
        <span class="badge">✔ Web MVC đang hoạt động</span>
    </div>
</body>
</html>
