# Kết nối tới MySQL Docker (mysql-sgu-2026)
spring.datasource.url=jdbc:mysql://localhost:3306/sgu_tuyensinh_2026?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Giữ nguyên tên bảng/cột để tránh lỗi Naming Strategy trên Linux/Docker
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl