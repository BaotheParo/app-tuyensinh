# ===============================
# Cấu hình ứng dụng (đơn giản - dễ đọc cho nhóm)
# ===============================

# Tên ứng dụng (hiển thị trong log)
spring.application.name=app-tuyensinh

# ===============================
# Kết nối MySQL
# ===============================
# Chú ý:
# - Đổi username/password theo máy của bạn.
# - Nếu bạn dùng MySQL 8+ và gặp lỗi timezone/SSL, URL dưới đây đã cấu hình các tham số phổ biến.
spring.datasource.url=jdbc:mysql://localhost:3306/app_tuyensinh_2026?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=

# Driver (Spring Boot thường tự đoán được, nhưng để rõ ràng cho sinh viên dễ hiểu)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
# Với dự án mới: create-drop (tạo lại bảng khi chạy) hoặc update (cập nhật bảng).
# Nhóm nên chọn 1 chế độ phù hợp và thống nhất.
spring.jpa.hibernate.ddl-auto=create

# In SQL ra log để debug (có thể tắt khi deploy)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
